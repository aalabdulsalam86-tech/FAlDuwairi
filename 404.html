<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الصفحة غير موجودة | مدرستي</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="any">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&family=Orbitron:wght@900&display=swap" rel="stylesheet">
<style>
:root{--cyan:#00f5ff;--gold:#fbbf24;--dark:#020617;--text:#f1f5f9;--muted:rgba(241,245,249,.65)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Tajawal",system-ui,sans-serif;background:var(--dark);color:var(--text);min-height:100vh;display:grid;place-items:center;padding:32px 20px;
  background-image:radial-gradient(circle,rgba(0,245,255,.09) 1px,transparent 1px);background-size:36px 36px}
main{max-width:520px;text-align:center}
.code{font-family:"Orbitron",sans-serif;font-weight:900;font-size:clamp(88px,22vw,150px);line-height:1;color:transparent;
  -webkit-text-stroke:2px var(--cyan);text-shadow:0 0 40px rgba(0,245,255,.35);direction:ltr;margin-bottom:20px}
h1{font-size:28px;font-weight:900;margin-bottom:12px}
p{font-size:17px;line-height:1.9;color:var(--muted);margin-bottom:32px}
.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
a{font-family:inherit;font-weight:700;font-size:16px;text-decoration:none;padding:13px 26px;border-radius:12px;transition:background .2s}
.primary{background:var(--cyan);color:var(--dark)}
.primary:hover{background:#7ffaff}
.ghost{color:var(--gold);border:1.5px solid rgba(251,191,36,.4)}
.ghost:hover{background:rgba(251,191,36,.08)}
a:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
</style>
</head>
<body>
<main>
  <div class="code" aria-hidden="true">404</div>
  <h1>هذه الصفحة غير موجودة</h1>
  <p>ربما تغيّر الرابط أو كُتب بشكل خاطئ. ارجع إلى الصفحة الرئيسية واختر صفّك ومادتك من هناك.</p>
  <div class="actions">
    <a class="primary" href="/">الصفحة الرئيسية</a>
    <a class="ghost" href="/assistant.html">اسأل المساعد الذكي</a>
  </div>
</main>
</body>
</html>
