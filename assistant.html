<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>🤖 المساعد الذكي — منصة المراجعة التفاعلية</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#020617;--card:rgba(15,23,42,.85);--txt:#f1f5f9;--mut:rgba(241,245,249,.62);--brd:rgba(255,255,255,.09);--cyan:#00f5ff;--gold:#fbbf24;--purple:#c026d3;--red:#ef4444}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Tajawal","Arial",sans-serif;background:var(--bg);color:var(--txt);height:100vh;display:flex;flex-direction:column;overflow:hidden;
  background-image:radial-gradient(ellipse 70% 45% at 50% -10%,rgba(0,245,255,.10) 0%,transparent 65%),radial-gradient(circle,rgba(255,255,255,.06) 1px,transparent 1px);background-size:100% 100%,34px 34px}
button{font-family:inherit;cursor:pointer}
a{color:var(--cyan)}
.top{background:rgba(2,6,23,.88);backdrop-filter:blur(16px);border-bottom:1px solid var(--brd);display:flex;align-items:center;gap:14px;padding:0 24px;height:62px;flex-shrink:0}
.brand{display:flex;align-items:center;gap:12px}
.brand .ic{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--cyan),var(--purple));display:flex;align-items:center;justify-content:center;font-size:20px}
.brand b{font-size:16px;font-weight:900}
.brand small{display:block;font-size:11px;color:var(--mut);font-family:Orbitron,sans-serif;letter-spacing:1px}
.sp{flex:1}
.tb{background:rgba(255,255,255,.05);border:1px solid var(--brd);border-radius:10px;padding:8px 14px;color:var(--mut);font-size:14px;font-weight:700;text-decoration:none;transition:.2s}
.tb:hover{color:var(--txt);background:rgba(255,255,255,.09)}
.wrap{flex:1;display:flex;flex-direction:column;max-width:900px;width:100%;margin:0 auto;padding:18px 20px 16px;min-height:0}
.chat{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding:6px 4px 10px;scroll-behavior:smooth}
.chat::-webkit-scrollbar{width:6px}.chat::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:3px}
.msg{display:flex;gap:10px;max-width:86%;animation:fd .25s ease}
@keyframes fd{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg.user{align-self:flex-start;flex-direction:row-reverse}
.msg.bot{align-self:flex-end}
.av{width:34px;height:34px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:17px;background:rgba(255,255,255,.06);border:1px solid var(--brd)}
.bot .av{background:linear-gradient(135deg,rgba(0,245,255,.25),rgba(192,38,211,.25))}
.bub{background:var(--card);border:1px solid var(--brd);border-radius:16px;padding:12px 16px;font-size:16px;line-height:1.85;overflow-wrap:anywhere}
.user .bub{background:rgba(0,245,255,.09);border-color:rgba(0,245,255,.25);border-top-left-radius:4px}
.bot .bub{border-top-right-radius:4px}
.bub p{margin-bottom:8px}.bub p:last-child{margin-bottom:0}
.bub ul,.bub ol{padding-right:22px;margin:4px 0 8px}
.bub li{margin-bottom:3px}
.bub b{color:#fff}
.bub code{font-family:ui-monospace,Menlo,monospace;background:rgba(255,255,255,.08);border-radius:5px;padding:1px 6px;font-size:.9em;direction:ltr;unicode-bidi:embed}
.bub pre{background:#0b1220;border:1px solid var(--brd);border-radius:10px;padding:12px 14px;margin:8px 0;overflow-x:auto;direction:ltr;text-align:left}
.bub pre code{background:none;padding:0;font-size:14px;line-height:1.6;color:#c7f0ff}
.bub.err{border-color:rgba(239,68,68,.5);color:#fca5a5}
.ref{margin:10px 0 2px;background:rgba(251,191,36,.07);border:1px solid rgba(251,191,36,.3);border-right:4px solid var(--gold);border-radius:12px;padding:10px 14px;font-size:15px;color:#fde68a}
.ref p{margin-bottom:4px}.ref b{color:var(--gold)}
.bub hr{border:none;border-top:1px solid var(--brd);margin:10px 0}
.typing{display:flex;gap:5px;padding:6px 2px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--cyan);animation:bl 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-4px)}}
.welcome{text-align:center;padding:26px 10px 6px}
.welcome .big{font-size:52px;margin-bottom:8px}
.welcome h1{font-size:24px;font-weight:900;margin-bottom:6px}
.welcome p{color:var(--mut);font-size:15px;line-height:1.8;max-width:560px;margin:0 auto}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:18px}
.chip{background:rgba(255,255,255,.04);border:1px solid var(--brd);border-radius:12px;padding:9px 14px;font-size:14px;color:var(--txt);transition:.2s;text-align:right}
.chip:hover{border-color:var(--cyan);color:var(--cyan);transform:translateY(-1px)}
.chip.rule{border-color:rgba(251,191,36,.3)}.chip.rule:hover{border-color:var(--gold);color:var(--gold)}
.box{flex-shrink:0;margin-top:10px;background:var(--card);border:1.5px solid var(--brd);border-radius:18px;padding:10px 10px 10px 12px;display:flex;align-items:flex-end;gap:10px;transition:.2s}
.box:focus-within{border-color:rgba(0,245,255,.45);box-shadow:0 0 0 3px rgba(0,245,255,.08)}
textarea{flex:1;background:none;border:none;outline:none;color:var(--txt);font-family:inherit;font-size:16px;line-height:1.6;resize:none;max-height:160px;padding:8px 6px}
textarea::placeholder{color:var(--mut)}
.send{width:44px;height:44px;border-radius:12px;border:none;background:var(--cyan);color:#020617;font-size:18px;font-weight:900;transition:.2s;flex-shrink:0}
.send:hover:not(:disabled){filter:brightness(1.1);transform:translateY(-1px)}
.send:disabled{opacity:.35;cursor:default}
.foot{text-align:center;font-size:12px;color:var(--mut);margin-top:8px;line-height:1.6}
.foot a{color:var(--mut)}
@media(max-width:640px){.top{padding:0 14px}.brand small{display:none}.wrap{padding:12px 12px 10px}.msg{max-width:95%}.bub{font-size:15px}.welcome h1{font-size:20px}.hide-m{display:none}}
</style></head>
<body>
<div class="top">
  <div class="brand"><div class="ic">🤖</div><div><b>المساعد الذكي</b><small>FALDUWAIRI ASSISTANT</small></div></div>
  <div class="sp"></div>
  <button class="tb" onclick="resetChat()">🗑 محادثة جديدة</button>
  <a class="tb hide-m" href="index.html">🏠 الموقع</a>
</div>

<div class="wrap">
  <div class="chat" id="chat"></div>
  <div class="box">
    <textarea id="inp" rows="1" placeholder="اكتب سؤالك هنا… (Enter للإرسال، Shift+Enter لسطر جديد)"></textarea>
    <button class="send" id="send" onclick="send()" title="إرسال">➤</button>
  </div>
  <div class="foot">قد يخطئ المساعد أحياناً — للوائح الرسمية ارجع إلى إدارة المدرسة أو <a href="https://www.moe.edu.kw" target="_blank">moe.edu.kw</a></div>
</div>

<script>
// ============ CONFIG ============
// Paste your Cloudflare Worker URL here after deploying assistant/worker.js
const API_URL = "https://falduwairi-assistant.a-alabdulsalam86.workers.dev";
// =================================

const STARTERS = [
  { t: "ما عقوبة الغش في الاختبار؟", rule: true },
  { t: "ما تصنيف المخالفات السلوكية ودرجاتها؟", rule: true },
  { t: "هل يجوز العقاب البدني في المدرسة؟", rule: true },
  { t: "ما حقوق الطالب في الدعم النفسي والاجتماعي؟", rule: true },
  { t: "اشرح لي الفرق بين while و for في Python" },
  { t: "ما الفرق بين المفتاح الأساسي والمفتاح الخارجي في قواعد البيانات؟" },
  { t: "كيف أحل معادلة من الدرجة الثانية؟" },
  { t: "لخّص لي نموذج CIA في الأمن السيبراني" }
];

let history = [];
let busy = false;
const chat = document.getElementById("chat"), inp = document.getElementById("inp"), sendBtn = document.getElementById("send");

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
// minimal markdown: code fences, inline code, bold, lists, paragraphs
function md(src){
  const blocks=[];
  src=src.replace(/```(\w*)\n?([\s\S]*?)```/g,(m,l,c)=>{blocks.push(`<pre><code>${esc(c.replace(/\n$/,""))}</code></pre>`);return `\u0000${blocks.length-1}\u0000`;});
  let h=esc(src)
    .replace(/`([^`\n]+)`/g,"<code>$1</code>")
    .replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
  const lines=h.split("\n"); let out="",list=null;
  const flush=()=>{if(list){out+=`</${list}>`;list=null;}};
  for(let ln of lines){
    const ul=/^\s*[-*•]\s+(.*)/.exec(ln), ol=/^\s*\d+[.)]\s+(.*)/.exec(ln);
    if(ul||ol){const k=ul?"ul":"ol"; if(list!==k){flush();out+=`<${k}>`;list=k;} out+=`<li>${(ul||ol)[1]}</li>`;}
    else if(/^\s*&gt;\s?/.test(ln)){const q=ln.replace(/^\s*&gt;\s?/,""); if(list!=="blockquote"){flush();out+=`<blockquote class="ref">`;list="blockquote";} out+=`<p>${q}</p>`;}
    else if(/^\s*#{1,6}\s+/.test(ln)){flush();out+=`<p><b>${ln.replace(/^\s*#{1,6}\s+/,"")}</b></p>`;}
    else if(/^\s*-{3,}\s*$/.test(ln)){flush();out+="<hr>";}
    else if(ln.trim()==="")flush();
    else{flush();out+=`<p>${ln}</p>`;}
  }
  flush();
  return out.replace(/\u0000(\d+)\u0000/g,(m,i)=>blocks[i]).replace(/<p>(<pre>[\s\S]*?<\/pre>)<\/p>/g,"$1");
}

function add(role,text,cls=""){
  const m=document.createElement("div");m.className="msg "+role;
  m.innerHTML=`<div class="av">${role==="user"?"🧑‍🎓":"🤖"}</div><div class="bub ${cls}">${role==="user"?esc(text).replace(/\n/g,"<br>"):md(text)}</div>`;
  chat.appendChild(m);chat.scrollTop=chat.scrollHeight;return m;
}
function welcome(){
  chat.innerHTML=`<div class="welcome"><div class="big">🤖</div><h1>مرحباً! أنا المساعد الذكي لمنصة المراجعة</h1>
  <p>أجيب عن أسئلتك حول <b>لوائح وزارة التربية</b> (الغياب، السلوك، الاختبارات، حقوق المتعلم)، وأساعدك في <b>أي مادة دراسية</b> لأي صف.</p>
  <div class="chips">${STARTERS.map(s=>`<button class="chip${s.rule?" rule":""}" onclick="ask(${JSON.stringify(s.t).replace(/"/g,"&quot;")})">${s.rule?"📜 ":"📚 "}${esc(s.t)}</button>`).join("")}</div></div>`;
}
function resetChat(){history=[];welcome();inp.value="";inp.focus();}
function ask(t){inp.value=t;send();}

async function send(){
  const text=inp.value.trim();
  if(!text||busy)return;
  if(API_URL.includes("YOUR-WORKER")){add("bot","لم يُضبط عنوان الخادم بعد — افتح assistant.html وضع رابط Cloudflare Worker في المتغير API_URL.","err");return;}
  const w=chat.querySelector(".welcome");if(w)w.remove();
  inp.value="";autosize();
  add("user",text);
  history.push({role:"user",text});
  busy=true;sendBtn.disabled=true;
  const t=document.createElement("div");t.className="msg bot";t.innerHTML=`<div class="av">🤖</div><div class="bub"><div class="typing"><i></i><i></i><i></i></div></div>`;chat.appendChild(t);chat.scrollTop=chat.scrollHeight;
  try{
    const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:history})});
    const d=await r.json().catch(()=>({}));
    t.remove();
    if(!r.ok||d.error){add("bot","حدث خطأ: "+(d.error||r.status),"err");history.pop();}
    else{add("bot",d.text);history.push({role:"model",text:d.text});}
  }catch(e){t.remove();add("bot","تعذّر الاتصال بالمساعد. تحقق من الإنترنت ثم حاول مجدداً.","err");history.pop();}
  busy=false;sendBtn.disabled=false;inp.focus();
}
function autosize(){inp.style.height="auto";inp.style.height=Math.min(inp.scrollHeight,160)+"px";}
inp.addEventListener("input",autosize);
inp.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}});
welcome();inp.focus();
</script>
</body></html>
